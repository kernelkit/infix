<svg xmlns="http://www.w3.org/2000/svg" width="680" height="192" viewBox="0 0 680 192" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <rect width="680" height="192" fill="#ffffff"/>
  <text x="20" y="20" fill="#333333">Strict priority above weighted sharing on a full port</text>
  <text x="437" y="44" text-anchor="middle" fill="#333333">all the port can send</text>
  <text x="20" y="79" fill="#333333" font-weight="bold">EF strict</text>
  <text x="202" y="79" text-anchor="end" fill="#555555">offered</text>
  <rect x="212" y="62" width="90" height="24" fill="#e4572e" stroke="#333333"/>
  <text x="257" y="79" text-anchor="middle" fill="#ffffff">EF 40</text>
  <rect x="302" y="62" width="135" height="24" fill="#4c86c6" stroke="#333333"/>
  <text x="369.5" y="79" text-anchor="middle" fill="#ffffff">AF21 60</text>
  <rect x="437" y="62" width="135" height="24" fill="#4f8a3c" stroke="#333333"/>
  <text x="504.5" y="79" text-anchor="middle" fill="#ffffff">CS1 60</text>
  <text x="202" y="111" text-anchor="end" fill="#555555">delivered</text>
  <rect x="212" y="94" width="90" height="24" fill="#e4572e" stroke="#333333"/>
  <text x="257" y="111" text-anchor="middle" fill="#ffffff">EF 40</text>
  <rect x="302" y="94" width="90" height="24" fill="#4c86c6" stroke="#333333"/>
  <text x="347" y="111" text-anchor="middle" fill="#ffffff">AF21 40</text>
  <rect x="392" y="94" width="45" height="24" fill="#4f8a3c" stroke="#333333"/>
  <text x="414.5" y="111" text-anchor="middle" fill="#ffffff">20</text>
  <text x="20" y="111" fill="#333333">the rest 2:1</text>
  <line x1="437" y1="50" x2="437" y2="130" stroke="#333333" stroke-dasharray="4 3"/>
  <text x="212" y="154" fill="#555555">percent of what the port can send</text>
</svg>
