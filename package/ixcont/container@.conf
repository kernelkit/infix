# Container instance %i.  ixcont sets up image, networking and the OCI
# bundle in pre:, crun starts the container detached and writes the PID
# of its init process, which Finit then supervises directly, and the
# post: script applies the restart policy.  The usr/container-%i
# condition is set by confd (or 'ixcont start') and cleared to stop
# without a restart.
service name:container log:prio:local1,tag:%i kill:30 restart:always	\
	pid:!/run/container:%i.pid					\
	pre:0,/usr/sbin/ixcont post:/usr/sbin/ixcont cleanup:0,/usr/sbin/ixcont \
	cgroup.system,delegate						\
	[2345] <!usr/container-%i> :%i crun run --detach --pid-file /run/container:%i.pid --bundle /run/containers/%i %i -- Container %i
