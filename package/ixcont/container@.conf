# Container instance %i.  ixcont sets up image, networking and the OCI
# bundle in pre:, crun starts the container detached and writes the PID
# of its init process, which Finit then supervises directly and starts
# again when it exits.  That is the restart policy 'always'; the other
# policies have a template each, made from this one when installed, see
# ixcont.mk.  The post: script runs when the container is stopped, or
# when Finit no longer restarts it.  The usr/container-%i condition is
# set by confd (or 'ixcont start') and cleared to stop the container.
service name:container log:prio:local1,tag:%i kill:30			\
	restart:always oncrash:script					\
	pid:!/run/container:%i.pid					\
	pre:0,/usr/sbin/ixcont post:/usr/sbin/ixcont cleanup:0,/usr/sbin/ixcont \
	cgroup.system,name:container@%i,delegate			\
	[2345] <!usr/container-%i> :%i crun run --detach --pid-file /run/container:%i.pid --bundle /run/containers/%i %i -- Container %i
