# Virtual modem AT emulator, QEMU test target only.  Installed with
# BR2_PACKAGE_FEATURE_MODEM_VIRTUAL, started by 00-modemsim setting the
# <usr/modemsim> condition once the virtual modem exists.
service [2345] <usr/modemsim> name:modemsim \
	/usr/libexec/infix/modemsim /dev/ttyGS0 -- Virtual modem (AT emulator)
