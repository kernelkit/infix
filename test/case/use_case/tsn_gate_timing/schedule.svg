<svg xmlns="http://www.w3.org/2000/svg" width="680" height="175" viewBox="0 0 680 175" font-family="DejaVu Sans, Arial, sans-serif" font-size="13">
  <rect width="680" height="175" fill="#ffffff"/>

  <!-- one cycle, 1000 µs = 500 px, starting at x=60; guard band 12.3 µs at 1 Gbit/s -->
  <g stroke="#333333" stroke-width="1">
    <rect x="60"    y="60" width="100"  height="70" fill="#e4572e"/>
    <rect x="160"   y="60" width="300"  height="70" fill="#4c86c6"/>
    <rect x="460"   y="60" width="93.8" height="70" fill="#4f8a3c"/>
    <rect x="553.8" y="60" width="6.2"  height="70" fill="#333333"/>
  </g>

  <!-- start of the next cycle, faded -->
  <rect x="560" y="60" width="100" height="70" fill="#e4572e" fill-opacity="0.3" stroke="#333333" stroke-opacity="0.4"/>
  <text x="610" y="100" text-anchor="middle" fill="#555555">next cycle</text>

  <g fill="#ffffff" text-anchor="middle">
    <text x="110" y="88" font-weight="bold">class 3</text>
    <text x="110" y="108">EF, scheduled</text>
    <text x="310" y="88" font-weight="bold">class 7, SR class A</text>
    <text x="310" y="108">AF31</text>
    <text x="507" y="88" font-weight="bold">classes</text>
    <text x="507" y="108">0–2, 4–6</text>
  </g>

  <!-- guard band label -->
  <line x1="556.9" y1="56" x2="556.9" y2="42" stroke="#333333"/>
  <text x="556.9" y="36" text-anchor="middle" fill="#333333">guard band, all gates closed</text>

  <text x="60" y="20" fill="#333333">Gates open, one 1 ms cycle on the gPTP grandmaster's clock</text>

  <!-- time axis -->
  <g stroke="#333333" stroke-width="1">
    <line x1="60" y1="140" x2="660" y2="140"/>
    <line x1="60"  y1="136" x2="60"  y2="144"/>
    <line x1="160" y1="136" x2="160" y2="144"/>
    <line x1="460" y1="136" x2="460" y2="144"/>
    <line x1="560" y1="136" x2="560" y2="144"/>
  </g>
  <g fill="#333333" text-anchor="middle">
    <text x="60"  y="160">0</text>
    <text x="160" y="160">200 µs</text>
    <text x="460" y="160">800 µs</text>
    <text x="560" y="160">1000 µs</text>
  </g>
</svg>
