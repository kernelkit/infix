# Weekly release build to catch flaky tests and verify clean builds.
# Runs without caches (ccache) to ensure reproducibility. See issue #1003.
#
# After the release build is tested and published, a build with all
# configuration snippets applied, like 'make dev', covers the opt-in
# features that are not in the defconfigs.  It waits for the release
# build and its tests, the two must not run at the same time.
name: Weekly Build

on:
  schedule:
    - cron: '5 0 * * 6'  # Saturday at 00:05 UTC, same as Coverity
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'kernelkit/infix'
    uses: ./.github/workflows/build-release.yml
    with:
      version: "latest"
      use_cache: false

  test:
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      name: "infix"
      target: "x86_64"
      release: "latest"

  publish:
    name: Publish Weekly Build
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "artifact-*"
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest Weekly Build"
          prerelease: true
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
          body: |
            Automated weekly build from `${{ github.sha }}`.

            This build runs without caches to catch potential flaky tests and build issues.
            Not intended for production use - use official releases instead.

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.run_id }}
          artifacts: "*.tar.gz,*.qcow2"

      - name: Summary
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # Weekly Build Published! :package:

          Latest artifacts uploaded to:
           <https://github.com/kernelkit/infix/releases/tag/latest>

          Built from commit: \`${{ github.sha }}\`
          EOF

  build-dev-x86_64:
    needs: [test, publish]
    if: ${{ !cancelled() && github.repository == 'kernelkit/infix' }}
    uses: ./.github/workflows/build.yml
    with:
      name: "infix-dev"
      target: "x86_64"
      config: "dev-config"

  build-dev-aarch64:
    needs: [test, publish]
    if: ${{ !cancelled() && github.repository == 'kernelkit/infix' }}
    uses: ./.github/workflows/build.yml
    with:
      name: "infix-dev"
      target: "aarch64"
      config: "dev-config"

  test-dev:
    needs: build-dev-x86_64
    uses: ./.github/workflows/test.yml
    with:
      name: "infix-dev"
      target: "x86_64"
      config: "dev-config"
