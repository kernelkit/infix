user  www-data www-data;
worker_processes  1;
error_log  syslog:server=unix:/dev/log,nohostname,facility=local7 warn;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # RESTCONF checks the password on every request, so limit how fast
    # another host can try.  The WebUI calls it over loopback, unlimited.
    geo $restconf_remote {
        default    1;
        127.0.0.1  0;
        ::1        0;
    }
    map $restconf_remote $restconf_limit_key {
        0  "";
        1  $binary_remote_addr;
    }
    limit_req_zone $restconf_limit_key zone=restconf:64k rate=10r/s;

    include /etc/nginx/enabled/*.conf;

    # Skip 2xx and 3xx
    # Skip 400 (e.g., rrousette syntax errors)
    map $status $loggable {
    	~^[23]  0;
	400 	0;
	default 1;
    }

    access_log syslog:server=unix:/dev/log,nohostname,facility=local7,severity=warn combined if=$loggable;
}
