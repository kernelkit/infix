set G_MESSAGES_DEBUG=nocolor
service [2345] manual:yes <service/dbus/running> notify:systemd \
	pre:/usr/libexec/infix/rauc-config-gen \
	env:-/etc/default/rauc  \
	rauc service $RAUC_ARGS -- Software update service
service [2345] <service/rauc/ready> name:rauc-idle log:null \
	/usr/libexec/infix/rauc-idle --
