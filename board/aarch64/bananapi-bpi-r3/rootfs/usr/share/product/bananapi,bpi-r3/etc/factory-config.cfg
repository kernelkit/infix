{
  "ieee802-dot1ab-lldp:lldp": {
    "infix-lldp:enabled": true
  },
  "ietf-hardware:hardware": {
    "component": [
      {
        "name": "usb",
        "class": "infix-hardware:usb",
        "state": {
          "admin-state": "unlocked"
        }
      },
      {
        "name": "radio0",
        "class": "infix-hardware:wifi",
        "infix-hardware:wifi-radio": {
          "band": "2.4GHz",
          "channel": "auto"
        }
      },
      {
        "name": "radio1",
        "class": "infix-hardware:wifi",
        "infix-hardware:wifi-radio": {
          "band": "5GHz",
          "channel": "auto"
        }
      }
    ],
    "infix-hardware:wifi": {
      "country-code": "DE"
    }
  },
  "ietf-interfaces:interfaces": {
    "interface": [
      {
        "name": "br0",
        "type": "infix-if-type:bridge",
        "ietf-ip:ipv4": {
          "forwarding": true,
          "address": [
            {
              "ip": "192.168.0.1",
              "prefix-length": 24
            }
          ]
        },
        "ietf-ip:ipv6": {
          "forwarding": true
        }
      },
      {
        "name": "lan1",
        "type": "infix-if-type:ethernet",
        "ietf-ip:ipv6": {},
        "infix-interfaces:bridge-port": {
          "bridge": "br0"
        }
      },
      {
        "name": "lan2",
        "type": "infix-if-type:ethernet",
        "ietf-ip:ipv6": {},
        "infix-interfaces:bridge-port": {
          "bridge": "br0"
        }
      },
      {
        "name": "lan3",
        "type": "infix-if-type:ethernet",
        "ietf-ip:ipv6": {},
        "infix-interfaces:bridge-port": {
          "bridge": "br0"
        }
      },
      {
        "name": "lan4",
        "type": "infix-if-type:ethernet",
        "ietf-ip:ipv6": {},
        "infix-interfaces:bridge-port": {
          "bridge": "br0"
        }
      },
      {
        "name": "lo",
        "type": "infix-if-type:loopback",
        "ietf-ip:ipv4": {
          "address": [
            {
              "ip": "127.0.0.1",
              "prefix-length": 8
            }
          ]
        },
        "ietf-ip:ipv6": {
          "address": [
            {
              "ip": "::1",
              "prefix-length": 128
            }
          ]
        }
      },
      {
        "name": "sfp1",
        "type": "infix-if-type:ethernet",
        "ietf-ip:ipv6": {}
      },
      {
        "name": "sfp2",
        "type": "infix-if-type:ethernet",
        "ietf-ip:ipv6": {}
      },
      {
        "name": "wan",
        "type": "infix-if-type:ethernet",
        "ietf-ip:ipv4": {
          "forwarding": true,
          "infix-dhcp-client:dhcp": {
            "option": [
              {
                "id": "ntp-server"
              },
              {
                "id": "broadcast"
              },
              {
                "id": "domain"
              },
              {
                "id": "hostname",
                "value": "auto"
              },
              {
                "id": "dns-server"
              },
              {
                "id": "router"
              },
              {
                "id": "netmask"
              },
              {
                "id": "vendor-class",
                "value": "Banana Pi BPI-R3"
              }
            ]
          }
        },
        "ietf-ip:ipv6": {
          "forwarding": true,
          "infix-dhcpv6-client:dhcp": {
            "option": [
              {
                "id": "ntp-server"
              },
              {
                "id": "client-fqdn"
              },
              {
                "id": "domain-search"
              },
              {
                "id": "dns-server"
              }
            ]
          }
        }
      },
      {
        "name": "wifi0-ap",
        "type": "infix-if-type:wifi",
        "infix-interfaces:wifi": {
          "radio": "radio0",
          "access-point": {
            "ssid": "Infix",
            "security": {
              "secret": "wifi"
            }
          }
        },
        "infix-interfaces:bridge-port": {
          "bridge": "br0"
        }
      },
      {
        "name": "wifi1-ap",
        "type": "infix-if-type:wifi",
        "infix-interfaces:wifi": {
          "radio": "radio1",
          "access-point": {
            "ssid": "Infix5Ghz",
            "security": {
              "secret": "wifi"
            }
          }
        },
        "infix-interfaces:bridge-port": {
          "bridge": "br0"
        }
      }
    ]
  },
  "ietf-keystore:keystore": {
    "asymmetric-keys": {
      "asymmetric-key": [
        {
          "name": "gencert",
          "public-key-format": "infix-crypto-types:x509-public-key-format",
          "public-key": "",
          "private-key-format": "infix-crypto-types:rsa-private-key-format",
          "cleartext-private-key": "",
          "certificates": {}
        },
        {
          "name": "genkey",
          "public-key-format": "infix-crypto-types:ssh-public-key-format",
          "public-key": "",
          "private-key-format": "infix-crypto-types:rsa-private-key-format",
          "cleartext-private-key": "",
          "certificates": {}
        }
      ]
    },
    "symmetric-keys": {
      "symmetric-key": [
        {
          "name": "wifi",
          "cleartext-symmetric-key": "aW5maXhpbmZpeA==",
          "key-format": "infix-crypto-types:passphrase-key-format"
        }
      ]
    }
  },
  "ietf-netconf-acm:nacm": {
    "enable-nacm": true,
    "read-default": "permit",
    "write-default": "deny",
    "exec-default": "deny",
    "groups": {
      "group": [
        {
          "name": "admin",
          "user-name": [
            "admin"
          ]
        },
        {
          "name": "operator",
          "user-name": []
        },
        {
          "name": "guest",
          "user-name": []
        }
      ]
    },
    "rule-list": [
      {
        "name": "admin-acl",
        "group": [
          "admin"
        ],
        "rule": [
          {
            "name": "permit-all",
            "module-name": "*",
            "access-operations": "*",
            "action": "permit",
            "comment": "Allow 'admin' group complete access to all operations and data."
          }
        ]
      },
      {
        "name": "default-permit-read-only-exec",
        "group": [
          "*"
        ],
        "rule": [
          {
            "name": "permit-get-schema",
            "module-name": "ietf-netconf-monitoring",
            "rpc-name": "get-schema",
            "access-operations": "exec",
            "action": "permit",
            "comment": "All users can fetch YANG modules over NETCONF."
          },
          {
            "name": "permit-bridge-fdb",
            "path": "/ietf-interfaces:interfaces/interface/infix-interfaces:bridge/get-forwarding-database",
            "access-operations": "exec",
            "action": "permit",
            "comment": "All users can list the bridge forwarding database."
          },
          {
            "name": "permit-radio-scan",
            "path": "/ietf-hardware:hardware/component/infix-hardware:wifi-radio/scan",
            "access-operations": "exec",
            "action": "permit",
            "comment": "All users can scan for Wi-Fi networks."
          },
          {
            "name": "permit-radio-survey",
            "path": "/ietf-hardware:hardware/component/infix-hardware:wifi-radio/channel-survey",
            "access-operations": "exec",
            "action": "permit",
            "comment": "All users can survey Wi-Fi channels."
          }
        ]
      },
      {
        "name": "operator-acl",
        "group": [
          "operator"
        ],
        "rule": [
          {
            "name": "permit-system-rpcs",
            "module-name": "ietf-system",
            "rpc-name": "*",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can reboot, shutdown, and set system time."
          },
          {
            "name": "permit-interfaces",
            "path": "/ietf-interfaces:interfaces",
            "access-operations": "create update delete",
            "action": "permit",
            "comment": "Operators can configure interfaces."
          },
          {
            "name": "permit-routing",
            "path": "/ietf-routing:routing",
            "access-operations": "create update delete",
            "action": "permit",
            "comment": "Operators can configure routing."
          },
          {
            "name": "permit-firewall",
            "path": "/infix-firewall:firewall",
            "access-operations": "create update delete",
            "action": "permit",
            "comment": "Operators can configure the firewall."
          },
          {
            "name": "permit-dhcp-server",
            "path": "/infix-dhcp-server:dhcp-server",
            "access-operations": "create update delete",
            "action": "permit",
            "comment": "Operators can configure the DHCP server."
          },
          {
            "name": "permit-lldp",
            "path": "/ieee802-dot1ab-lldp:lldp",
            "access-operations": "create update delete",
            "action": "permit",
            "comment": "Operators can configure LLDP."
          },
          {
            "name": "permit-hostname",
            "path": "/ietf-system:system/hostname",
            "access-operations": "create update delete",
            "action": "permit",
            "comment": "Operators can set the hostname."
          },
          {
            "name": "permit-contact",
            "path": "/ietf-system:system/contact",
            "access-operations": "create update delete",
            "action": "permit",
            "comment": "Operators can set the contact."
          },
          {
            "name": "permit-location",
            "path": "/ietf-system:system/location",
            "access-operations": "create update delete",
            "action": "permit",
            "comment": "Operators can set the location."
          },
          {
            "name": "permit-clock",
            "path": "/ietf-system:system/clock",
            "access-operations": "create update delete",
            "action": "permit",
            "comment": "Operators can set the time zone."
          },
          {
            "name": "permit-dhcp-server-clear",
            "path": "/infix-dhcp-server:dhcp-server/statistics/clear",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can clear the DHCP server statistics."
          },
          {
            "name": "permit-address-set-add",
            "path": "/infix-firewall:firewall/address-set/add",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can add dynamic entries to a firewall address set."
          },
          {
            "name": "permit-address-set-remove",
            "path": "/infix-firewall:firewall/address-set/remove",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can remove dynamic entries from a firewall address set."
          },
          {
            "name": "permit-address-set-flush",
            "path": "/infix-firewall:firewall/address-set/flush",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can flush the dynamic entries of a firewall address set."
          },
          {
            "name": "permit-edit-config",
            "module-name": "ietf-netconf",
            "rpc-name": "edit-config",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can change configuration over NETCONF."
          },
          {
            "name": "permit-edit-data",
            "module-name": "ietf-netconf-nmda",
            "rpc-name": "edit-data",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can change configuration over NETCONF."
          },
          {
            "name": "permit-lock",
            "module-name": "ietf-netconf",
            "rpc-name": "lock",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can lock a datastore over NETCONF."
          },
          {
            "name": "permit-unlock",
            "module-name": "ietf-netconf",
            "rpc-name": "unlock",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can unlock a datastore over NETCONF."
          },
          {
            "name": "permit-commit",
            "module-name": "ietf-netconf",
            "rpc-name": "commit",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can commit the candidate over NETCONF."
          },
          {
            "name": "permit-discard-changes",
            "module-name": "ietf-netconf",
            "rpc-name": "discard-changes",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can discard candidate changes over NETCONF."
          },
          {
            "name": "permit-validate",
            "module-name": "ietf-netconf",
            "rpc-name": "validate",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can validate configuration over NETCONF."
          },
          {
            "name": "permit-copy-config",
            "module-name": "ietf-netconf",
            "rpc-name": "copy-config",
            "access-operations": "exec",
            "action": "permit",
            "comment": "Operators can save configuration over NETCONF."
          }
        ]
      },
      {
        "name": "guest-acl",
        "group": [
          "guest"
        ],
        "rule": [
          {
            "name": "deny-all-write+exec",
            "module-name": "*",
            "access-operations": "create update delete exec",
            "action": "deny",
            "comment": "Guests cannot change anything or exec rpcs."
          }
        ]
      },
      {
        "name": "default-deny-all",
        "group": [
          "*"
        ],
        "rule": [
          {
            "name": "deny-password-access",
            "path": "/ietf-system:system/authentication/user/password",
            "access-operations": "*",
            "action": "deny",
            "comment": "No user except admins can access password hashes."
          },
          {
            "name": "deny-keystore-access",
            "module-name": "ietf-keystore",
            "access-operations": "*",
            "action": "deny",
            "comment": "No user except admins can access cryptographic keys."
          },
          {
            "name": "deny-truststore-access",
            "module-name": "ietf-truststore",
            "access-operations": "*",
            "action": "deny",
            "comment": "No user except admins can access trust store."
          }
        ]
      }
    ]
  },
  "ietf-system:system": {
    "hostname": "bpi-%m",
    "infix-system:software": {
      "update-url": "https://github.com/kernelkit/infix/releases.atom",
      "check-update": {
        "schedule": "weekly"
      },
      "unattended-update": {
        "schedule": "weekly",
        "reboot": "immediate"
      }
    },
    "infix-schedule:schedules": {
      "schedule": [
        {
          "name": "nightly",
          "description": "Every night at 03:00",
          "recurrence": {
            "frequency": "ietf-schedule:daily",
            "byhour": [
              3
            ]
          }
        },
        {
          "name": "weekly",
          "description": "Sunday nights at 03:00",
          "recurrence": {
            "frequency": "ietf-schedule:weekly",
            "byday": [
              {
                "weekday": "sunday"
              }
            ],
            "byhour": [
              3
            ]
          }
        }
      ]
    },
    "ntp": {
      "server": [
        {
          "name": "default",
          "udp": {
            "address": "pool.ntp.org"
          }
        }
      ]
    },
    "authentication": {
      "user": [
        {
          "name": "admin",
          "password": "$factory$",
          "infix-system:shell": "bash"
        }
      ]
    },
    "infix-system:motd-banner": "Li0tLS0tLS0uCnwgIC4gLiAgfCBJbmZpeCBPUyDigJQgSW1tdXRhYmxlLkZyaWVuZGx5LlNlY3VyZQp8LS4gdiAuLXwgaHR0cHM6Ly9rZXJuZWxraXQub3JnCictJy0tLSctJwo="
  },
  "infix-dhcp-server:dhcp-server": {
    "option": [
      {
        "id": "ntp-server",
        "address": "auto"
      },
      {
        "id": "dns-server",
        "address": "auto"
      },
      {
        "id": "router",
        "address": "auto"
      }
    ],
    "subnet": [
      {
        "subnet": "192.168.0.0/24",
        "pool": {
          "start-address": "192.168.0.100",
          "end-address": "192.168.0.250"
        }
      }
    ]
  },
  "infix-firewall:firewall": {
    "default": "wan",
    "zone": [
      {
        "name": "lan",
        "action": "accept",
        "interface": [
          "br0"
        ]
      },
      {
        "name": "wan",
        "action": "drop",
        "interface": [
          "wan"
        ],
        "service": [
          "dhcpv6-client"
        ]
      }
    ],
    "policy": [
      {
        "name": "lan-to-wan",
        "action": "accept",
        "ingress": [
          "lan"
        ],
        "egress": [
          "wan"
        ],
        "masquerade": true
      }
    ]
  },
  "infix-meta:meta": {
    "version": "1.11"
  },
  "infix-services:mdns": {
    "enabled": true
  },
  "infix-services:ssh": {
    "enabled": true,
    "hostkey": [
      "genkey"
    ],
    "listen": [
      {
        "name": "ipv4",
        "address": "0.0.0.0",
        "port": 22
      },
      {
        "name": "ipv6",
        "address": "::",
        "port": 22
      }
    ]
  },
  "infix-services:web": {
    "enabled": true,
    "certificate": "gencert",
    "console": {
      "enabled": true
    },
    "netbrowse": {
      "enabled": true
    },
    "restconf": {
      "enabled": true
    }
  }
}
