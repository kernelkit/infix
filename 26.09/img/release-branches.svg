<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460"
     font-family="Lato, 'Source Sans 3', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="459" rx="8" fill="#fbfbfc" stroke="#e2e6ea"/>

  <text x="24" y="34" font-size="16" font-weight="700" fill="#2a2a2a">Where kernel and Buildroot LTS updates go</text>
  <text x="24" y="54" font-size="12" fill="#5c6370">Development carries new features as well; a release branch only moves the LTS patch level.</text>

  <!-- ================= main ================= -->
  <text x="24" y="110" font-size="14" font-weight="700" fill="#2a2a2a">main</text>
  <text x="24" y="128" font-size="11" fill="#5c6370">development,</text>
  <text x="24" y="143" font-size="11" fill="#5c6370">~monthly releases</text>

  <line x1="170" y1="105" x2="866" y2="105" stroke="#ff7f2a" stroke-width="3"/>
  <polygon points="866,98 880,105 866,112" fill="#ff7f2a"/>

  <g font-size="11" fill="#2a2a2a" text-anchor="middle">
    <circle cx="220" cy="105" r="6" fill="#ff7f2a"/><text x="220" y="88">v26.08.0</text>
    <circle cx="350" cy="105" r="6" fill="#ff7f2a"/><text x="350" y="88">v26.09.0</text>
    <circle cx="480" cy="105" r="6" fill="#ff7f2a"/><text x="480" y="88">v26.10.0</text>
    <circle cx="610" cy="105" r="6" fill="#ff7f2a"/><text x="610" y="88">v26.11.0</text>
    <circle cx="740" cy="105" r="6" fill="#ff7f2a"/><text x="740" y="88">v26.12.0</text>
  </g>

  <!-- ================= release branch ================= -->
  <text x="24" y="258" font-size="14" font-weight="700" fill="#0056b2">v26.08.x</text>
  <text x="24" y="276" font-size="11" fill="#5c6370">patch releases,</text>
  <text x="24" y="291" font-size="11" fill="#5c6370">cut on demand</text>

  <path d="M 220 111 V 233 Q 220 253 240 253 H 700" fill="none" stroke="#0056b2" stroke-width="3"/>
  <line x1="700" y1="253" x2="790" y2="253" stroke="#0056b2" stroke-width="3" stroke-dasharray="6 6"/>
  <g font-size="11" fill="#2a2a2a" text-anchor="middle">
    <circle cx="350" cy="253" r="6" fill="#0056b2"/><text x="350" y="277">v26.08.1</text>
    <circle cx="520" cy="253" r="6" fill="#0056b2"/><text x="520" y="277">v26.08.2</text>
  </g>

  <line x1="350" y1="117" x2="350" y2="241" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <line x1="520" y1="112" x2="520" y2="241" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <text x="560" y="220" font-size="11" fill="#5c6370" stroke="#fbfbfc" stroke-width="4" paint-order="stroke">the fix that triggered the release, plus LTS patch bumps</text>

  <!-- ================= LTS branch ================= -->
  <text x="24" y="378" font-size="14" font-weight="700" fill="#2f855a">v26.02.x</text>
  <text x="24" y="396" font-size="11" fill="#5c6370">Infix LTS (Wires),</text>
  <text x="24" y="411" font-size="11" fill="#5c6370">scheduled upkeep</text>

  <line x1="150" y1="373" x2="180" y2="373" stroke="#2f855a" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="180" y1="373" x2="800" y2="373" stroke="#2f855a" stroke-width="3"/>
  <line x1="800" y1="373" x2="866" y2="373" stroke="#2f855a" stroke-width="3" stroke-dasharray="6 6"/>
  <g font-size="11" fill="#2a2a2a" text-anchor="middle">
    <circle cx="260" cy="373" r="6" fill="#2f855a"/><text x="260" y="397">v26.02.5</text>
    <circle cx="420" cy="373" r="6" fill="#2f855a"/><text x="420" y="397">v26.02.6</text>
    <circle cx="580" cy="373" r="6" fill="#2f855a"/><text x="580" y="397">v26.02.7</text>
    <circle cx="740" cy="373" r="6" fill="#2f855a"/><text x="740" y="397">v26.02.8</text>
  </g>

  <line x1="260" y1="112" x2="260" y2="361" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <line x1="420" y1="112" x2="420" y2="361" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <line x1="580" y1="112" x2="580" y2="361" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <line x1="740" y1="112" x2="740" y2="361" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <!-- line hops: the release branch passes over the arrows headed for the LTS branch -->
  <g fill="#fbfbfc">
    <rect x="256" y="245" width="8" height="16"/>
    <rect x="416" y="245" width="8" height="16"/>
    <rect x="576" y="245" width="8" height="16"/>
    <rect x="736" y="245" width="8" height="16"/>
  </g>
  <line x1="240" y1="253" x2="700" y2="253" stroke="#0056b2" stroke-width="3"/>
  <line x1="700" y1="253" x2="790" y2="253" stroke="#0056b2" stroke-width="3" stroke-dasharray="6 6"/>

  <text x="450" y="341" font-size="11" fill="#5c6370" stroke="#fbfbfc" stroke-width="4" paint-order="stroke">LTS patch bumps and backported fixes, on a schedule of their own</text>

  <!-- ================= legend ================= -->
  <line x1="600" y1="440" x2="640" y2="440" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="650" y="444" font-size="11" fill="#5c6370">ported from main</text>
</svg>
