[tool.poetry]
name = "ixcont"
version = "1.0"
description = "Infix container runtime glue for crun"
license = "BSD-3-Clause"
packages = [
    { include = "ixcont" }
]
authors = [
  "KernelKit developers"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
ixcont = "ixcont.cli:main"
