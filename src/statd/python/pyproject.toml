[tool.poetry]
name = "infix-yang-tools"
version = "1.0"
description = "CLI formatting of Infix operational data"
license = "MIT"
packages = [
    { include = "cli_pretty" }
]
authors = [
  "KernelKit developers"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
cli-pretty = "cli_pretty:main"
