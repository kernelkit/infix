[tool.poetry]
name = "infix-yang-tools"
version = "1.0"
description = "Linux to infix-YANG"
license = "MIT"
packages = [
    { include = "yanger" },
    { include = "cli_pretty" },
    { include = "ospf_status" },
    { include = "ospf6_status" },
    { include = "rip_status" }
]
authors = [
  "KernelKit developers"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.scripts]
yanger = "yanger.__main__:main"
cli-pretty = "cli_pretty:main"
ospf-status = "ospf_status:main"
ospf6-status = "ospf6_status:main"
rip-status = "rip_status.rip_status:main"
